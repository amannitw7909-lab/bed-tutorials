<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B.Ed. Study Hub</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="theme-light" data-fontsize="md">

  <!-- TOP NAV -->
  <header class="topnav" role="banner">
    <div class="topnav__brand">
      <span class="topnav__icon">📚</span>
      <span class="topnav__title">B.Ed. Study Hub</span>
    </div>
    <div class="topnav__controls">
      <div class="search-wrap">
        <input type="search" id="searchInput" placeholder="Search topics…" aria-label="Search topics" autocomplete="off" />
        <div id="searchDropdown" class="search-dropdown" role="listbox" hidden></div>
      </div>
      <button id="langToggle" class="btn btn--icon" title="Toggle Language" aria-label="Toggle Language">EN / हि</button>
      <button id="fontDec" class="btn btn--icon" title="Decrease Font" aria-label="Decrease font size">A−</button>
      <button id="fontInc" class="btn btn--icon" title="Increase Font" aria-label="Increase font size">A+</button>
      <button id="themeToggle" class="btn btn--icon" title="Toggle Theme" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <!-- LAYOUT WRAPPER -->
  <div class="layout" id="appLayout">

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar" aria-label="Subject navigation">
      <button class="sidebar__close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      <div id="sidebarContent"><!-- populated by JS --></div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="main" id="mainContent" role="main">

      <!-- DASHBOARD (shown by default) -->
      <section class="dashboard" id="dashboard">
        <div class="dashboard__hero">
          <h1>Welcome to B.Ed. Study Hub</h1>
          <p>Your bilingual (English + Hindi) companion for B.Ed. exam preparation.</p>
        </div>
        <div class="dashboard__grid" id="dashboardGrid"><!-- populated by JS --></div>
      </section>

      <!-- TOPIC VIEWER (hidden until topic selected) -->
      <section class="viewer" id="viewer" hidden>
        <div class="viewer__toolbar">
          <button class="btn btn--outline" id="backBtn">← Back</button>
          <div class="viewer__meta">
            <span id="viewerBreadcrumb" class="breadcrumb"></span>
          </div>
          <div class="progress-wrap">
            <span id="progressLabel" class="progress-label"></span>
            <button class="btn btn--sm" id="markReadBtn">✓ Mark as Read</button>
          </div>
        </div>
        <div class="viewer__nav">
          <button class="btn btn--outline" id="prevTopicBtn">‹ Prev</button>
          <span id="topicCounter"></span>
          <button class="btn btn--outline" id="nextTopicBtn">Next ›</button>
        </div>
        <article class="content-card" id="contentCard"><!-- rendered content --></article>
        <div class="viewer__nav viewer__nav--bottom">
          <button class="btn btn--outline" id="prevTopicBtn2">‹ Prev</button>
          <button class="btn btn--outline" id="nextTopicBtn2">Next ›</button>
        </div>
      </section>

      <!-- FOOTER -->
      <footer class="app-footer" role="contentinfo">
        <div class="footer-content">
          <p class="footer-dev">Developed by <strong class="footer-author">Aman Gour</strong></p>
          <div class="footer-socials">
            <a href="https://www.instagram.com/a_man_0101/" target="_blank" rel="noopener noreferrer" class="social-btn social-btn--instagram" aria-label="Instagram - a_man_0101" title="Instagram">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <defs>
                  <linearGradient id="igHoverGrad" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#285aeb"/>
                    <stop offset="35%" stop-color="#d6249f"/>
                    <stop offset="65%" stop-color="#fd5949"/>
                    <stop offset="100%" stop-color="#fdf497"/>
                  </linearGradient>
                </defs>
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
              </svg>
            </a>
            <a href="https://www.linkedin.com/in/aman-gour-60bb56210" target="_blank" rel="noopener noreferrer" class="social-btn social-btn--linkedin" aria-label="LinkedIn - Aman Gour" title="LinkedIn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452z"/>
              </svg>
            </a>
          </div>
        </div>
      </footer>

    </main>
  </div>

  <!-- SIDEBAR OPEN BUTTON (mobile) -->
  <button class="fab-menu" id="fabMenu" aria-label="Open menu">☰</button>

  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="./data/content-store.js"></script>
  <script src="./js/parser.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
